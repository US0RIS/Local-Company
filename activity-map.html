<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Company — Activity Map</title>
<style>
:root{color-scheme:dark;--bg:#0b0e12;--panel:#11161c;--panel2:#171d25;--border:#28313c;--text:#eef2f7;--muted:#8d99aa;--accent:#6678ff;--green:#3acb8c;--yellow:#e5b64a;--red:#ed646d;--purple:#a77bf2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select{font:inherit;color:inherit}.top{height:62px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 18px;background:#0e1217;position:sticky;top:0;z-index:10}.brand{font-weight:760;font-size:16px}.sub{font-size:11px;color:var(--muted)}.sp{flex:1}.btn,.pill,select{border:1px solid var(--border);background:var(--panel2);border-radius:9px;padding:8px 10px}.btn{cursor:pointer;text-decoration:none}.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:calc(100vh - 62px)}.main{padding:16px;min-width:0}.side{border-left:1px solid var(--border);background:#0f1318;padding:17px;overflow:auto}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar label{font-size:11px;color:var(--muted)}.error{display:none;background:#321a1e;border:1px solid #73343d;color:#ffadb4;border-radius:9px;padding:10px;margin-bottom:12px}.canvas{border:1px solid var(--border);background:linear-gradient(#10151b,#0d1116);border-radius:13px;overflow:auto}.canvas svg{display:block;min-width:900px;width:100%;height:550px}.edge{stroke:#424c59;stroke-width:1.5;fill:none}.edge.task{stroke:var(--purple);stroke-dasharray:6 5;stroke-width:2}.node{cursor:pointer}.node rect{fill:#171d25;stroke:#2b3541}.node:hover rect,.node.sel rect{stroke:var(--accent);stroke-width:2}.name{fill:var(--text);font-weight:700;font-size:13px}.title,.tasktxt{fill:var(--muted);font-size:10px}.tasktxt{fill:#ccd4df}.dot{stroke:#0d1116;stroke-width:2}.IDLE{fill:#66717d}.THINKING,.REVIEWING{fill:var(--purple)}.WORKING,.USING_TOOL,.IN_MEETING{fill:var(--green)}.WAITING_FOR_AGENT,.WAITING_FOR_HUMAN{fill:var(--yellow)}.BLOCKED,.ERROR{fill:var(--red)}.flow{margin-top:14px;border:1px solid var(--border);background:var(--panel);border-radius:13px;padding:13px}.flow h2{font-size:14px;margin:0 0 9px}.row{display:grid;grid-template-columns:90px 170px minmax(220px,1fr) 100px 110px;gap:9px;padding:8px 5px;border-top:1px solid #202832;align-items:center;font-size:12px}.row.head{border-top:0;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.tag{font-size:10px;border:1px solid var(--border);border-radius:999px;padding:3px 7px;width:max-content}.sec{padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid var(--border)}.eye{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:9px}.agent{display:flex;gap:11px;align-items:center}.avatar{width:50px;height:50px;border-radius:12px;background:#475365;display:grid;place-items:center;font-weight:800;font-size:17px}.hname{font-size:18px;font-weight:760}.meta,.small{color:var(--muted);font-size:11px}.kv{display:grid;grid-template-columns:105px 1fr;gap:7px 9px;font-size:12px}.k{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:8px}.ct{font-weight:700}.reason,.next{margin-top:9px;padding:9px;border-left:2px solid var(--purple);background:#15131e;font-size:12px}.next{border-left-color:#6ca9ff;background:#111824}.empty{color:var(--muted);padding:22px;text-align:center}.legend{font-size:11px;color:var(--muted)}@media(max-width:1000px){.grid{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--border)}.row{grid-template-columns:85px 1fr 95px}.row>*:nth-child(3),.row>*:nth-child(5){display:none}}
</style>
</head>
<body>
<div class="top"><div><div class="brand">Company Activity Map</div><div class="sub">hierarchy, delegation, live work, observable model actions, and next steps</div></div><div class="sp"></div><div class="pill"><span class="live"></span><span id="conn">Connecting…</span></div><button class="btn" id="refresh">Refresh</button><a class="btn" href="/">Back to company</a></div>
<div class="grid"><main class="main"><div class="toolbar"><label>Overlay</label><select id="overlay"><option value="tasks" selected>Hierarchy + assignments</option><option value="hierarchy">Hierarchy only</option></select><label>Tasks</label><select id="filter"><option value="active" selected>Active / queued</option><option value="all">Include completed</option></select><div class="sp"></div><div class="legend">Green = working · Purple = thinking/reviewing · Yellow = waiting · Red = blocked/error</div></div><div class="error" id="error"></div><div class="canvas"><svg id="org" viewBox="0 0 1200 550" aria-label="Company hierarchy"></svg></div><section class="flow"><h2>Task delegation and execution</h2><div class="row head"><div>State</div><div>Assignee</div><div>Task</div><div>Elapsed</div><div>Origin</div></div><div id="rows"></div></section></main><aside class="side" id="detail"><div class="empty">Select an employee.</div></aside></div>
<script>
(()=>{const API='http://127.0.0.1:8000',$=id=>document.getElementById(id),S={agents:[],tasks:[],calls:[],selected:null};const unwrap=x=>Array.isArray(x)?x:(x?.items||x?.agents||x?.tasks||x?.data||x?.results||[]);const first=(o,ks,d=null)=>{for(const k of ks)if(o&&o[k]!=null)return o[k];return d};const id=a=>String(first(a,['id','uuid','agent_id'],'')).trim(),name=a=>first(a,['name','display_name'],'Employee'),title=a=>first(a,['job_title','title','role'],'Employee'),mid=a=>{const v=first(a,['manager_id','managerId','reports_to_id','reports_to']);return v&&typeof v==='object'?id(v):v?String(v):null},tid=t=>String(first(t,['id','uuid','task_id'],'')).trim(),ass=t=>{const v=first(t,['assignee_id','assigneeId','agent_id','assigned_to']);return v&&typeof v==='object'?id(v):v?String(v):null},creator=t=>{const v=first(t,['creator_id','creatorId','created_by','manager_id']);return v&&typeof v==='object'?id(v):v?String(v):null},st=t=>String(first(t,['state','status'],'QUEUED')).toUpperCase(),tt=t=>first(t,['title','name','description'],'Untitled task'),stamp=t=>first(t,['started_at','start_time','updated_at','created_at']),date=v=>{if(!v)return null;const d=new Date(v);return isNaN(d)?null:d},elapsed=v=>{const d=date(v);if(!d)return'—';let s=Math.max(0,Math.floor((Date.now()-d)/1000));if(s<60)return`${s}s`;if(s<3600)return`${Math.floor(s/60)}m ${s%60}s`;if(s<86400)return`${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;return`${Math.floor(s/86400)}d ${Math.floor((s%86400)/3600)}h`},active=s=>!['COMPLETE','FAILED','CANCELLED'].includes(s),status=a=>String(first(a,['status','current_status'],'IDLE')).toUpperCase(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function getAny(paths){let e;for(const p of paths){try{const r=await fetch(API+p,{cache:'no-store'});if(r.ok)return await r.json();if(r.status!==404)e=new Error(`${p}: HTTP ${r.status}`)}catch(x){e=x}}if(e)throw e;return[]}function cur(aid){return S.tasks.filter(t=>ass(t)===aid&&active(st(t))).sort((a,b)=>({IN_PROGRESS:0,REVIEW:1,NEEDS_APPROVAL:2,BLOCKED:3,READY:4,QUEUED:5,WAITING:6}[st(a)]??9)-({IN_PROGRESS:0,REVIEW:1,NEEDS_APPROVAL:2,BLOCKED:3,READY:4,QUEUED:5,WAITING:6}[st(b)]??9))[0]||null}function nxt(aid,c){return S.tasks.filter(t=>ass(t)===aid&&active(st(t))&&(!c||tid(t)!==tid(c))).sort((a,b)=>Number(first(b,['priority'],0))-Number(first(a,['priority'],0)))[0]||null}function latest(aid){return S.calls.filter(c=>String(first(c,['agent_id','requesting_agent_id','agentId'],''))===aid).sort((a,b)=>(date(first(b,['created_at','started_at','request_time']))||0)-(date(first(a,['created_at','started_at','request_time']))||0))[0]||null}function reason(aid,t){const c=latest(aid);if(c){const a=first(c,['parsed_action','parsed_actions','structured_action','action']);if(a)return typeof a==='string'?a:JSON.stringify(a,null,2);const o=first(c,['output','response','normal_output','summary']);if(o)return String(o).slice(0,650)}return t?String(first(t,['description','instructions','result'],'')).slice(0,650):''}function nextText(aid,t,n){if(n)return`${tt(n)} (${st(n)})`;if(t){if(st(t)==='REVIEW')return'Manager review / approval';if(['BLOCKED','NEEDS_APPROVAL'].includes(st(t)))return'Resolve blocker or human approval';if(st(t)==='IN_PROGRESS')return'Finish current task and report upward';if(st(t)==='WAITING')return'Resume when dependency changes'}return S.agents.some(a=>mid(a)===aid)?'Review direct reports or allocate the next bounded task':'Wait for assigned work or propose useful work upward'}async function load(){$('conn').textContent='Refreshing…';$('error').style.display='none';try{const[a,t,c]=await Promise.all([getAny(['/api/agents','/api/employees']),getAny(['/api/tasks','/api/work/tasks']),getAny(['/api/model-calls','/api/model_calls','/api/inference/calls']).catch(()=>[])]);S.agents=unwrap(a);S.tasks=unwrap(t);S.calls=unwrap(c);if(!S.selected&&S.agents.length)S.selected=id(S.agents.find(a=>!mid(a))||S.agents[0]);$('conn').textContent=`Live · ${S.agents.length} employees`;render()}catch(e){$('conn').textContent='Backend error';$('error').textContent=`Could not load activity data: ${e.message}`;$('error').style.display='block'}}function positions(){const by=new Map(S.agents.map(a=>[id(a),a])),roots=S.agents.filter(a=>!mid(a)||!by.has(mid(a))),levels=[],q=roots.map(a=>[a,0]),seen=new Set;while(q.length){const[a,d]=q.shift();if(seen.has(id(a)))continue;seen.add(id(a));(levels[d]??=[]).push(a);S.agents.filter(x=>mid(x)===id(a)).forEach(x=>q.push([x,d+1]))}S.agents.filter(a=>!seen.has(id(a))).forEach(a=>(levels[0]??=[]).push(a));const p=new Map;levels.forEach((arr,d)=>{const gap=1080/(arr.length+1);arr.forEach((a,i)=>p.set(id(a),{x:60+gap*(i+1)-90,y:35+d*145}))});return p}function tree(){const svg=$('org');svg.innerHTML='';const p=positions(),ns='http://www.w3.org/2000/svg',line=(a,b,cls)=>{const e=document.createElementNS(ns,'path');e.setAttribute('d',`M${a.x+90} ${a.y+84} C${a.x+90} ${(a.y+b.y+84)/2},${b.x+90} ${(a.y+b.y+84)/2},${b.x+90} ${b.y}`);e.setAttribute('class',cls);svg.appendChild(e)};S.agents.forEach(a=>{const m=p.get(mid(a)),x=p.get(id(a));if(m&&x)line(m,x,'edge')});if($('overlay').value==='tasks'){const seen=new Set;S.tasks.filter(t=>active(st(t))).forEach(t=>{const a=p.get(creator(t)),b=p.get(ass(t)),k=`${creator(t)}>${ass(t)}`;if(a&&b&&creator(t)!==ass(t)&&!seen.has(k)){seen.add(k);line(a,b,'edge task')}})}S.agents.forEach(a=>{const x=p.get(id(a));if(!x)return;const g=document.createElementNS(ns,'g');g.setAttribute('class','node'+(S.selected===id(a)?' sel':''));g.setAttribute('transform',`translate(${x.x},${x.y})`);g.innerHTML=`<rect width="180" height="84" rx="11"/><circle cx="16" cy="18" r="6" class="dot ${status(a)}"/><text x="29" y="22" class="name">${esc(name(a))}</text><text x="14" y="42" class="title">${esc(title(a))}</text><text x="14" y="62" class="tasktxt">${esc((cur(id(a))?tt(cur(id(a))):'No active task').slice(0,27))}</text><text x="14" y="76" class="title">${esc(status(a))}</text>`;g.addEventListener('click',()=>{S.selected=id(a);render()});svg.appendChild(g)})}function rows(){const list=($('filter').value==='all'?S.tasks:S.tasks.filter(t=>active(st(t)))).slice().sort((a,b)=>(date(stamp(b))||0)-(date(stamp(a))||0)).slice(0,40);$('rows').innerHTML=list.length?list.map(t=>{const a=S.agents.find(x=>id(x)===ass(t)),c=S.agents.find(x=>id(x)===creator(t));return`<div class="row"><div><span class="tag">${esc(st(t))}</span></div><div>${esc(a?name(a):ass(t)||'—')}</div><div><b>${esc(tt(t))}</b><div class="small">${esc(String(first(t,['description','instructions'],'')).slice(0,110))}</div></div><div>${elapsed(stamp(t))}</div><div>${esc(c?name(c):creator(t)||'Human/system')}</div></div>`}).join(''):'<div class="empty">No tasks returned.</div>'}function detail(){const a=S.agents.find(x=>id(x)===S.selected);if(!a){$('detail').innerHTML='<div class="empty">Select an employee.</div>';return}const aid=id(a),m=S.agents.find(x=>id(x)===mid(a)),reports=S.agents.filter(x=>mid(x)===aid),t=cur(aid),n=nxt(aid,t),r=reason(aid,t),delegated=S.tasks.filter(x=>creator(x)===aid&&ass(x)!==aid&&active(st(x))),ini=name(a).split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();$('detail').innerHTML=`<div class="sec"><div class="eye">Employee</div><div class="agent"><div class="avatar">${esc(ini)}</div><div><div class="hname">${esc(name(a))}</div><div class="meta">${esc(title(a))} · ${esc(first(a,['department'],'—'))}</div><div style="margin-top:6px"><span class="tag">${esc(status(a))}</span>${t?` <span class="small">${elapsed(stamp(t))}</span>`:''}</div></div></div></div><div class="sec"><div class="eye">Rank & reporting</div><div class="kv"><div class="k">Manager</div><div>${esc(m?name(m):'Human owner')}</div><div class="k">Direct reports</div><div>${esc(reports.length?reports.map(name).join(', '):'None')}</div><div class="k">Model</div><div>${esc(first(a,['model_assignment','model','model_name'],'qwen3:8b'))}</div></div></div><div class="sec"><div class="eye">Current work</div>${t?`<div class="card"><div class="ct">${esc(tt(t))}</div><div class="small">${esc(st(t))} · ${elapsed(stamp(t))}</div><div style="margin-top:7px">${esc(first(t,['description','instructions'],'No description.'))}</div></div>`:'<div class="small">No active task.</div>'}<div class="reason"><b>Observable model action / plan</b><br>${r?esc(r):'No structured action or normal model output is currently exposed. Hidden chain-of-thought is not displayed.'}</div><div class="next"><b>What is next</b><br>${esc(nextText(aid,t,n))}</div></div><div class="sec"><div class="eye">Delegated by this agent</div>${delegated.length?delegated.slice(0,8).map(x=>{const to=S.agents.find(a=>id(a)===ass(x));return`<div class="card"><div class="ct">→ ${esc(to?name(to):ass(x))}</div><div>${esc(tt(x))}</div><div class="small">${esc(st(x))} · ${elapsed(stamp(x))}</div></div>`}).join(''):'<div class="small">No active delegated tasks.</div>'}</div>`}function render(){tree();rows();detail()}$('refresh').addEventListener('click',load);$('overlay').addEventListener('change',render);$('filter').addEventListener('change',render);setInterval(()=>{if(S.agents.length){rows();detail()}},1000);setInterval(load,5000);load()})();
</script>
</body></html>
